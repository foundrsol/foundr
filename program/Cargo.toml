[package]
name = "shell-vault"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
mainnet-v2 = []

[dependencies]
pinocchio = "=0.11.1"
pinocchio-system = "=0.6.1"
solana-address = { version = "=2.6.0", default-features = false, features = ["decode"] }
solana-sha256-hasher = { version = "=3.1.0", default-features = false }
# Exact source is vendored and checked by scripts/verify-upstream.mjs.
winterwallet-core = { path = "../vendor/winterwallet/core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(target_arch, values("bpf"))'] }
